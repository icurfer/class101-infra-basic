frontend fe_https
    bind *:80
    bind *:443 ssl crt /etc/haproxy/ssl/bundle.pem alpn h2,http/1.1

    # 80으로 들어온 요청만 HTTPS로 리다이렉트
    http-request redirect scheme https code 301 if !{ ssl_fc }

    option forwardfor
    # HTTPS로 들어온 경우에만 X-Forwarded-Proto 설정
    http-request set-header X-Forwarded-Proto https if { ssl_fc }

    default_backend app

backend app
    balance roundrobin
    server app1 10.0.3.62:80 check
